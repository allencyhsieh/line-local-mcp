[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "line-mcp-local"
version = "0.1.0"
description = "A privacy-first, read-only MCP gateway for a locally synchronized LINE archive"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Allen Hsieh" }]
keywords = ["line", "mcp", "model-context-protocol", "claude", "privacy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["mcp>=2.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.25", "pytest-cov>=5.0", "ruff>=0.9"]

[project.scripts]
line-mcp-local = "line_mcp_local.server:main"

[project.urls]
Homepage = "https://github.com/allencyhsieh/line-mcp-local"
Repository = "https://github.com/allencyhsieh/line-mcp-local"
Issues = "https://github.com/allencyhsieh/line-mcp-local/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/line_mcp_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
